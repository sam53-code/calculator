<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script defer src="js/script.js"></script>
  </head>
  <body>
    <header>
      <ul>
        <li>Home</li>
        <li>Basic Calculator</li>
        <li>Scientific Calculator</li>
      </ul>
    </header>

    <div class="basic-calculator">
      <div class="calculator">
        <h2>Calculator</h2>
        <input type="text" id="display" class="display" readonly value="" />

        <div class="flex-row">
          <button type="button" class="clearBtn btn" data-action="clear">
            CE
          </button>
          <button type="button" class="backspace btn" data-action="delete">
            &#x232B;
          </button>
          <button type="button" class="percentage btn" data-action="operator">
            &#37;
          </button>
          <button
            type="button"
            class="operator btn"
            data-action="operator"
            data-value="/"
          >
            &divide;
          </button>
        </div>

        <div class="flex-row">
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="1"
          >
            1
          </button>
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="2"
          >
            2
          </button>
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="3"
          >
            3
          </button>
          <button
            type="button"
            class="operator btn"
            data-action="operator"
            data-value="*"
          >
            &times;
          </button>
        </div>

        <div class="flex-row">
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="4"
          >
            4
          </button>
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="5"
          >
            5
          </button>
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="6"
          >
            6
          </button>
          <button
            type="button"
            class="operator btn"
            data-action="operator"
            data-value="-"
          >
            &minus;
          </button>
        </div>

        <div class="flex-row">
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="7"
          >
            7
          </button>
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="8"
          >
            8
          </button>
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="9"
          >
            9
          </button>
          <button
            type="button"
            class="operator btn"
            data-action="operator"
            data-value="+"
          >
            &plus;
          </button>
        </div>

        <div class="flex-row">
          <button type="button" class="plus-minus btn" data-action="operator">
            &#177;
          </button>
          <button
            type="button"
            class="number btn"
            data-action="number"
            data-value="0"
          >
            0
          </button>
          <button type="button" class="decimal btn" data-action="decimal">
            &#46;
          </button>
          <button
            type="button"
            class="equals operator btn"
            data-action="equals"
            data-value="="
          >
            &#61;
          </button>
        </div>
      </div>
    </div>

    <div class="scientific-calculator">
      <h2></h2>
    </div>
  </body>
</html>
